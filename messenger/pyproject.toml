[project]
name = "fb-messenger-assistant"
version = "0.1.0"
description = "Read 1:1 Facebook Messenger threads and prepare reply drafts (never auto-sends)."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 60
