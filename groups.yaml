# =============================================================================
# 投稿先 Facebook グループ設定
# =============================================================================
# 共通設定(署名・連絡先・既定値)は下の &shared にまとめ、各グループは
#   <<: *shared でそれを取り込み、id / name / post_url / 個別の selection_order /
#   enabled だけ書く。新規グループの追加はこの groups: リストに1ブロック足すだけ。
#
# enabled は「Bot(サカモト ヒロシ)が実際にそのグループのメンバーで、投稿してよい」
# と確認できたものだけ true。未参加/未確認は false にして投稿させない(=スパム判定や
# 失敗投稿を避ける)。所属確認は scripts/discover_joined_groups.py の結果が根拠。
#
# selection_order: 各グループが「自分の次の未投稿物件」をこの順で独立選択。
#   グループごとに別の順にすると、同じ物件が同日に複数グループへ出るのを防げる
#   (FBがスパム扱いする)。値: newest / price_asc / price_desc / yield_desc。

_shared: &shared
  tone: "プロフェッショナル"
  max_chars: 1200
  active_hours: [7, 23]
  allow_links: false
  allow_images: true
  forbidden: ["保証", "絶対", "確実"]
  # 署名は link-strip の後に付くので、allow_links:false でも LINE公式と
  # コミュニティ招待リンクは常に残る(物件自体の外部URLだけ抑制される)。
  signature: |-
    ━━━━━━━━━━━━━
    📲 弊社では独自ルートで仕入れた未公開物件を不定期で配信しています。
    　 よろしければLINEでも物件情報をお届けしていますので、お気軽にご登録ください。
    　 👉 https://lin.ee/8u8OJTSL

    👥 不動産投資の情報交換コミュニティも運営しています。ご興味があればこちらもどうぞ。
    　 👉 https://www.facebook.com/groups/2217518449046952/
    ━━━━━━━━━━━━━
  contact: |-
    ━━━━━━━━━━━━━
    📩 ご質問・資料請求はお気軽に
    Messenger でメッセージ、または
    ✉️ bukken511+ag@gmail.com
    ━━━━━━━━━━━━━

