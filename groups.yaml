groups:
  - id: "1281008662437696"
    name: "不動産投資家コミュニティ"
    post_url: "https://www.facebook.com/groups/1281008662437696"
    # selection_order: each group independently picks its OWN next unposted
    # property by this order. Distinct orders across groups keep the same
    # property from being posted to multiple groups on the same day (which FB
    # treats as spam). "newest" = most recently created first.
    selection_order: "newest"
    tone: "プロフェッショナル"
    max_chars: 1200
    active_hours: [7, 23]
    allow_links: false
    allow_images: true
    forbidden: ["保証", "絶対", "確実"]
    # signature is appended AFTER link-stripping, so the LINE 公式アカウント and
    # community invite links below always survive even though allow_links is
    # false (only the property's own external URL is suppressed). The LINE link
    # promotes our own 未公開物件 channel; the FB link invites to our community.
    signature: |-
      ━━━━━━━━━━━━━
      📲 弊社では独自ルートで仕入れた未公開物件を不定期で配信しています。
      　 よろしければLINEでも物件情報をお届けしていますので、お気軽にご登録ください。
      　 👉 https://lin.ee/8u8OJTSL

      👥 不動産投資の情報交換コミュニティも運営しています。ご興味があればこちらもどうぞ。
      　 👉 https://www.facebook.com/groups/2217518449046952/
      ━━━━━━━━━━━━━
    contact: |-
      ━━━━━━━━━━━━━
      📩 ご質問・資料請求はお気軽に
      Messenger でメッセージ、または
      ✉️ bukken511+ag@gmail.com
      ━━━━━━━━━━━━━
    enabled: true

