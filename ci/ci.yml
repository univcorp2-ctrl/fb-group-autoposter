name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  deep-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Deep verification 50 rounds
        run: python scripts/run_tests_50.py --rounds 50
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-verification-artifacts
          path: |
            screenshots/
            logs/
          if-no-files-found: ignore
