name: Cleanup core-test diagnostic
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove temporary diagnostic assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f CI_CORE_TEST_DIAGNOSTIC.md .github/workflows/diagnose-core-tests.yml .github/workflows/cleanup-core-diagnostic.yml
          git commit -m 'Remove temporary core-test diagnostics'
          git push origin HEAD:main
