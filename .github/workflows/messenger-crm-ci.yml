name: messenger-crm-ci

on:
  push:
    paths:
      - "messenger/src/messenger_crm/**"
      - "messenger/tests/test_messenger_crm_phase1.py"
      - "messenger/tests/test_multichannel_crm_dashboard.py"
      - "messenger/scripts/messenger_crm_demo.py"
      - "messenger/scripts/export_multichannel_crm_dashboard.py"
      - "docs/messenger_crm_phase1.md"
      - "docs/multichannel_crm_dashboard.md"
      - ".github/workflows/messenger-crm-ci.yml"
  pull_request:
    paths:
      - "messenger/src/messenger_crm/**"
      - "messenger/tests/test_messenger_crm_phase1.py"
      - "messenger/tests/test_multichannel_crm_dashboard.py"
      - "messenger/scripts/messenger_crm_demo.py"
      - "messenger/scripts/export_multichannel_crm_dashboard.py"
      - "docs/messenger_crm_phase1.md"
      - "docs/multichannel_crm_dashboard.md"
      - ".github/workflows/messenger-crm-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Syntax check
        run: python -m compileall messenger/src/messenger_crm messenger/tests/test_messenger_crm_phase1.py messenger/tests/test_multichannel_crm_dashboard.py messenger/scripts/messenger_crm_demo.py messenger/scripts/export_multichannel_crm_dashboard.py

      - name: Ruff critical check
        run: ruff check --isolated --select F401,F821,F841 messenger/src/messenger_crm messenger/tests/test_messenger_crm_phase1.py messenger/tests/test_multichannel_crm_dashboard.py messenger/scripts/messenger_crm_demo.py messenger/scripts/export_multichannel_crm_dashboard.py

      - name: Unit tests
        run: pytest messenger/tests/test_messenger_crm_phase1.py messenger/tests/test_multichannel_crm_dashboard.py

      - name: Demo export
        run: |
          python messenger/scripts/messenger_crm_demo.py
          python messenger/scripts/export_multichannel_crm_dashboard.py

      - name: Upload EstateBoard sample payloads
        uses: actions/upload-artifact@v4
        with:
          name: messenger-crm-estateboard-payloads
          path: |
            output/messenger_crm_snapshot.json
            output/estateboard_crm_dashboard.json
