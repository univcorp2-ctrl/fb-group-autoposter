name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - site/data/status.json
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: ruff check . --config pyproject.toml --output-format=github

  existing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-github-actions-annotate-failures
      - name: Existing core tests
        run: >-
          pytest -q --no-cov
          --ignore=tests/test_analytics_export.py
          --ignore=tests/test_facebook_metrics.py
          --ignore=tests/test_drive_assets.py
          --ignore=tests/test_runtime_status.py
          --ignore=tests/test_codex_provider.py

  recovery-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-github-actions-annotate-failures
      - name: Drive image resolver
        run: pytest -q --no-cov tests/test_drive_assets.py
      - name: Runtime status exporter
        run: pytest -q --no-cov tests/test_runtime_status.py
      - name: Codex provider
        run: pytest -q --no-cov tests/test_codex_provider.py

  analytics-export-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest -q --no-cov tests/test_analytics_export.py

  facebook-metrics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest -q --no-cov tests/test_facebook_metrics.py

  deep-verify:
    needs: [lint, existing-tests, recovery-tests, analytics-export-tests, facebook-metrics-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m compileall -q src scripts tests
      - name: Validate production files
        run: |
          test -f src/drive_assets.py
          test -f src/codex_provider.py
          test -f src/runtime_status.py
          test -f scripts/repair_windows_runtime.ps1
          test -f scripts/run_daily_drive.py
          test -f site/index.html
          test -f docs/architecture.md
          test -f docs/setup.md
          test -f CODEX.md
      - uses: actions/upload-artifact@v4
        with:
          name: fb-autoposter-status-site
          path: site
