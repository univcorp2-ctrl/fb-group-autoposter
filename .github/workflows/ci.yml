name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov ruff
      - name: Ruff check
        run: ruff check .

  existing-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov
      - name: Run existing test suite
        shell: bash
        run: |
          pytest -q --no-cov \
            --ignore=tests/test_analytics_export.py \
            --ignore=tests/test_facebook_metrics.py || \
          pytest -q --no-cov \
            --ignore=tests/test_analytics_export.py \
            --ignore=tests/test_facebook_metrics.py

  analytics-export-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov
      - name: Run analytics export tests
        shell: bash
        run: |
          pytest -q --no-cov tests/test_analytics_export.py || \
          pytest -q --no-cov tests/test_analytics_export.py

  facebook-metrics-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Import metric module
        run: python -c "from src.facebook_metrics import extract_metric_counts, parse_compact_number"
      - name: Parse Japanese ten-thousand suffix
        run: python -c "from src.facebook_metrics import parse_compact_number; assert parse_compact_number('1.2万') == 12000"
      - name: Parse K suffix
        run: python -c "from src.facebook_metrics import parse_compact_number; assert parse_compact_number('2.5K') == 2500"
      - name: Parse comma number
        run: python -c "from src.facebook_metrics import parse_compact_number; assert parse_compact_number('1,234') == 1234"
      - name: Japanese reactions
        run: python -c "from src.facebook_metrics import extract_metric_counts; assert extract_metric_counts('リアクション 18 コメント 4件 シェア 2件 表示 1.2万回')['reactions'] == 18"
      - name: Japanese comments
        run: python -c "from src.facebook_metrics import extract_metric_counts; assert extract_metric_counts('リアクション 18 コメント 4件 シェア 2件 表示 1.2万回')['comments'] == 4"
      - name: Japanese shares
        run: python -c "from src.facebook_metrics import extract_metric_counts; assert extract_metric_counts('リアクション 18 コメント 4件 シェア 2件 表示 1.2万回')['shares'] == 2"
      - name: Japanese views
        run: python -c "from src.facebook_metrics import extract_metric_counts; assert extract_metric_counts('リアクション 18 コメント 4件 シェア 2件 表示 1.2万回')['views'] == 12000"
      - name: English reactions
        run: python -c "from src.facebook_metrics import extract_metric_counts; assert extract_metric_counts('25 reactions 7 comments 3 shares 1.5K views')['reactions'] == 25"
      - name: English comments
        run: python -c "from src.facebook_metrics import extract_metric_counts; assert extract_metric_counts('25 reactions 7 comments 3 shares 1.5K views')['comments'] == 7"
      - name: English shares
        run: python -c "from src.facebook_metrics import extract_metric_counts; assert extract_metric_counts('25 reactions 7 comments 3 shares 1.5K views')['shares'] == 3"
      - name: English views
        run: python -c "from src.facebook_metrics import extract_metric_counts; assert extract_metric_counts('25 reactions 7 comments 3 shares 1.5K views')['views'] == 1500"

  deep-verify:
    needs: [lint, existing-tests, analytics-export-tests, facebook-metrics-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Validate required analytics files
        shell: bash
        run: |
          test -f src/analytics_export.py
          test -f src/facebook_metrics.py
          test -f scripts/sync_analytics.py
          test -f scripts/collect_post_metrics.py
          test -f docs/facebook_analytics.md
