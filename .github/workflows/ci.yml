name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: ruff check . --config pyproject.toml --output-format=github

  existing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Core and recovery tests
        run: pytest -q --no-cov --ignore=tests/test_analytics_export.py --ignore=tests/test_facebook_metrics.py

  analytics-export-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest -q --no-cov tests/test_analytics_export.py

  facebook-metrics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest -q --no-cov tests/test_facebook_metrics.py

  deep-verify:
    needs: [lint, existing-tests, analytics-export-tests, facebook-metrics-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m compileall -q src scripts tests
      - name: Validate recovery and dashboard files
        run: |
          test -f src/drive_assets.py
          test -f src/codex_provider.py
          test -f src/runtime_status.py
          test -f scripts/repair_windows_runtime.ps1
          test -f scripts/run_daily_drive.py
          test -f site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: fb-autoposter-status-site
          path: site
