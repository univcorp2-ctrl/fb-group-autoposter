name: Analytics diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov ruff
      - name: Import metric module
        continue-on-error: true
        run: python -c "from src.facebook_metrics import extract_metric_counts, parse_compact_number"
      - name: Parse Japanese ten-thousand suffix
        continue-on-error: true
        run: python -c "from src.facebook_metrics import parse_compact_number; assert parse_compact_number('1.2万') == 12000"
      - name: Parse K suffix
        continue-on-error: true
        run: python -c "from src.facebook_metrics import parse_compact_number; assert parse_compact_number('2.5K') == 2500"
      - name: Parse comma number
        continue-on-error: true
        run: python -c "from src.facebook_metrics import parse_compact_number; assert parse_compact_number('1,234') == 1234"
      - name: Parse Japanese metrics
        continue-on-error: true
        run: python -c "from src.facebook_metrics import extract_metric_counts; assert extract_metric_counts('リアクション: 18 コメント 4件 シェア 2件 表示 1.2万回') == {'reactions':18,'comments':4,'shares':2,'views':12000}"
      - name: Parse English metrics
        continue-on-error: true
        run: python -c "from src.facebook_metrics import extract_metric_counts; assert extract_metric_counts('25 reactions 7 comments 3 shares 1.5K views') == {'reactions':25,'comments':7,'shares':3,'views':1500}"
      - name: Finish diagnostics
        run: exit 1
