name: Analytics diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-japanese-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Japanese reactions equals 18
        continue-on-error: true
        run: |
          python -c "from src.facebook_metrics import extract_metric_counts; assert extract_metric_counts('リアクション: 18 コメント 4件 シェア 2件 表示 1.2万回')['reactions'] == 18"
      - name: Japanese comments equals 4
        continue-on-error: true
        run: |
          python -c "from src.facebook_metrics import extract_metric_counts; assert extract_metric_counts('リアクション: 18 コメント 4件 シェア 2件 表示 1.2万回')['comments'] == 4"
      - name: Japanese shares equals 2
        continue-on-error: true
        run: |
          python -c "from src.facebook_metrics import extract_metric_counts; assert extract_metric_counts('リアクション: 18 コメント 4件 シェア 2件 表示 1.2万回')['shares'] == 2"
      - name: Japanese views equals 12000
        continue-on-error: true
        run: |
          python -c "from src.facebook_metrics import extract_metric_counts; assert extract_metric_counts('リアクション: 18 コメント 4件 シェア 2件 表示 1.2万回')['views'] == 12000"
      - name: Finish diagnostics
        run: exit 1
