name: Analytics diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov ruff
      - name: Run analytics export tests
        run: pytest -q --no-cov tests/test_analytics_export.py
      - name: Validate metric parser
        shell: bash
        run: |
          python - <<'PY'
          from src.facebook_metrics import extract_metric_counts, parse_compact_number
          assert parse_compact_number("1.2万") == 12000
          assert extract_metric_counts("25 reactions 7 comments 3 shares 1.5K views")["views"] == 1500
          PY
