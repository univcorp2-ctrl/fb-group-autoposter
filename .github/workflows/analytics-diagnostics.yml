name: Analytics diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov ruff
      - name: Compact number parsing
        continue-on-error: true
        run: pytest -q --no-cov tests/test_facebook_metrics.py::test_parse_compact_number
      - name: Japanese metric parsing
        continue-on-error: true
        run: pytest -q --no-cov tests/test_facebook_metrics.py::test_extract_japanese_metrics
      - name: English metric parsing
        continue-on-error: true
        run: pytest -q --no-cov tests/test_facebook_metrics.py::test_extract_english_metrics
      - name: Finish diagnostics
        run: exit 1
